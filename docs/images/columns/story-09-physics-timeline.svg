<svg xmlns="http://www.w3.org/2000/svg" width="720" height="986" viewBox="0 0 720 986" role="img" aria-labelledby="title desc">
  <title id="title">再生は進むのに なぜ揺れが戻らなかったのか</title>
  <desc id="desc">当時の再生優先モードの概念図。再生時計が次のフレームへ進む間も裏では物理演算を続ける。全モデルの結果が揃う前に復帰対象が更新されると、画面はVMDの姿勢だけを表示し続ける。修正後は復帰対象を保持して物理を反映した姿勢を実際に表示してから次の対象へ進む。</desc>
  <defs>
    <style>
      text{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#24243b}
      .top{font-size:40px;font-weight:750;letter-spacing:-.05em}
      .section{font-size:31px;font-weight:750}
      .label{font-size:29px;font-weight:750}
      .body{font-size:29px;font-weight:510}
      .foot{font-size:26px;fill:#52516a}
    </style>
  </defs>
  <rect width="720" height="986" rx="26" fill="#f7f5f1"/>
  <text class="top" x="30" y="63">なぜ揺れが戻らなかったのか</text>
  <text class="foot" x="32" y="108">当時の「再生優先モード」の概念図</text>

  <rect x="23" y="142" width="674" height="440" rx="23" fill="#fff" stroke="#ded9e6" stroke-width="2"/>
  <text class="section" x="45" y="192">修正前｜復帰対象が先へ進む</text>

  <rect x="43" y="216" width="634" height="82" rx="12" fill="#e9eff9"/>
  <text class="label" x="60" y="265">再生時計</text>
  <text class="body" x="235" y="265">フレーム N → 次のフレーム</text>

  <rect x="43" y="310" width="634" height="106" rx="12" fill="#e6f2ed"/>
  <text class="label" x="60" y="372">物理演算</text>
  <text class="body" x="235" y="353">裏で計算は進む</text>
  <text class="body" x="235" y="389">全モデルの結果はまだ揃わない</text>

  <rect x="43" y="428" width="634" height="82" rx="12" fill="#f9eddf"/>
  <text class="label" x="60" y="478">画面表示</text>
  <text class="body" x="235" y="478">物理反映前のVMD姿勢が続く</text>

  <text class="foot" x="48" y="553">結果が揃う前に 復帰対象が何度も更新される</text>

  <rect x="23" y="604" width="674" height="290" rx="23" fill="#efedf8" stroke="#dcd7ed" stroke-width="2"/>
  <text class="section" x="45" y="653">修正後｜復帰対象を保持する</text>
  <path d="M72 708v130" stroke="#9b8abb" stroke-width="4"/>
  <g fill="#5e4d7e">
    <circle cx="72" cy="712" r="17"/><circle cx="72" cy="775" r="17"/><circle cx="72" cy="838" r="17"/>
  </g>
  <g font-size="23" font-weight="750" text-anchor="middle">
    <text x="72" y="720" style="fill:#fff">1</text><text x="72" y="783" style="fill:#fff">2</text><text x="72" y="846" style="fill:#fff">3</text>
  </g>
  <text class="body" x="107" y="722">復帰に使うフレームを保持</text>
  <text class="body" x="107" y="785">全モデルの物理結果を同じ時点で揃える</text>
  <text class="body" x="107" y="848">実際に画面へ出してから 次の対象へ</text>

  <text class="foot" x="31" y="935">保持するのは復帰対象で 再生時計は止めない</text>
  <text class="foot" x="31" y="967">図の間隔は実測値ではありません</text>
</svg>
